name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request supersedes the build already running for it.
# Builds of main are never cancelled, so every main commit keeps its artifact.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build simulator app
        run: |
          set -o pipefail
          # Keep the full log for the failure artifact below. xcbeautify (preinstalled on
          # the macOS runner images) condenses the output and turns compiler errors and
          # warnings into annotations on the run and the PR diff.
          if command -v xcbeautify >/dev/null; then
            FORMAT=(xcbeautify --renderer github-actions)
          else
            FORMAT=(cat)
          fi
          xcodebuild \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_DEBUG_DYLIB=NO \
            ENABLE_PREVIEWS=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee xcodebuild.log | "${FORMAT[@]}"

      - name: Upload full build log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: xcodebuild.log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Zip .app bundle
        run: |
          set -e
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          test -n "$APP_PATH" || (echo "no .app under build/" && exit 1)
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/Lumen-Simulator.app.zip" "$(basename "$APP_PATH")"

      - uses: actions/upload-artifact@v6
        with:
          name: Lumen-Simulator.app.zip
          path: Lumen-Simulator.app.zip
          if-no-files-found: error
